name: Repo Updates

on:
  repository_dispatch:
    types: [zulip-dm]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Send reviewer report to Zulip
        env:
          # GH_TOKEN must be a PAT with read access to Alex-Zughaid/physlib -
          # the automatic GITHUB_TOKEN below only has access to this repo
          # (PhysLibBots), not physlib, so GH_TOKEN is required here.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPOSITORY: "Alex-Zughaid/physlib"

          # Number of reviews to consider 'busy'
          BUSY_THRESHOLD: "3"

          # These Zulip secrets are configured in the repo settings
          # (PhysLibBots -> Settings -> Secrets and variables -> Actions)
          ZULIP_SITE: ${{ secrets.ZULIP_SITE }}
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
          # Sent by the Zulip DM relay (via repository_dispatch); the report
          # is sent back as a direct message to this user.
          ZULIP_DM_SENDER_ID: ${{ github.event.client_payload.sender_id }}
        run: python3 scripts/repo-updates-script.py
